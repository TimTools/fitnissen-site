<style>
  /* 1. Full-Bleed Breakout Strategy */
  .intake-full-bleed {
    width: 100vw;
    position: relative;
    left: 50%;
    right: 50%;
    margin-left: -50vw;
    margin-right: -50vw;
    padding: 0;
    box-sizing: border-box;
    overflow: hidden;
    background: transparent;
  }

  /* 2. Seamless Iframe */
  .intake-iframe {
    width: 100%;
    border: 0;
    display: block;
    background: transparent;
    min-height: 800px;
    transition: height 0.2s ease-out; /* Smoother resize animation */
  }
  
  .intake-footer {
    text-align: center; 
    padding: 1.5rem; 
    color: inherit; 
    opacity: 0.7;
    font-size: 0.9rem;
  }
</style>

<div class="intake-full-bleed" id="intakeContainer">
  <iframe id="intakeIframe"
          class="intake-iframe"
          src="https://intake.myotherfiles.nl/?embed=1"
          title="Intake formulier - Fit Nissen"
          loading="lazy"
          scrolling="auto" 
          allow="clipboard-read; clipboard-write; microphone; camera; geolocation; encrypted-media"
          sandbox="allow-forms allow-scripts allow-same-origin allow-popups">
  </iframe>

  <div class="intake-footer">
    Werkt het bovenstaande formulier niet niet? <a href="https://intake.myotherfiles.nl/" target="_blank" rel="noopener" style="text-decoration:underline; color: inherit;">Open intake in nieuw venster</a>
  </div>
</div>

<script>
(function () {
  const iframe = document.getElementById('intakeIframe');
  const allowedChildOrigin = 'https://intake.myotherfiles.nl';

  // --- THEME CONFIGURATION ---
  const layoutTheme = "{{ page.header.theme | default: page.article_header.theme }}";
  const accentColor = '#1f7a4a';
  const textColorDark = '#e6eef3';
  const textColorLight = '#222222';

  function getActiveTheme() {
    // 1. Force match with contact.html YAML if present
    if (layoutTheme === 'dark' || layoutTheme === 'light') return layoutTheme;
    // 2. Fallback: Detect global theme
    let theme = document.documentElement.getAttribute('data-bs-theme') || localStorage.getItem('theme');
    if (!theme) {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    return theme;
  }

  function sendTheme() {
    const theme = getActiveTheme();
    const payload = {
      type: 'setTheme',
      theme: theme,
      accent: accentColor,
      textColor: theme === 'dark' ? textColorDark : textColorLight
    };
    try { iframe.contentWindow.postMessage(JSON.stringify(payload), allowedChildOrigin); } catch (e) { }
  }

  // --- HEIGHT RESIZING ---
  function requestChildHeight() {
    try { iframe.contentWindow.postMessage(JSON.stringify({ type: 'requestHeight' }), allowedChildOrigin); } catch (e) {}
  }

  window.addEventListener('message', function (e) {
    if (allowedChildOrigin !== '*' && e.origin !== allowedChildOrigin) return;
    
    let data;
    try { data = (typeof e.data === 'string') ? JSON.parse(e.data) : e.data; } catch (err) { return; }
    if (!data || !data.type) return;

    if (data.type === 'setHeight' && data.height) {
      const h = parseInt(data.height, 10);
      // We add a small buffer (+20px) to prevent scrollbars from appearing due to rounding errors
      if (!isNaN(h) && h > 100) {
        iframe.style.height = (h + 20) + 'px';
      }
    }
  }, false);

  // --- INITIALIZATION & LOOP ---
  iframe.addEventListener('load', function () {
    // Immediate checks on load
    setTimeout(requestChildHeight, 100);
    setTimeout(sendTheme, 100);
  });

  // START CONTINUOUS POLLING
  // We check height every 500ms forever. This ensures that if validation errors
  // appear or the user clicks "Next", the iframe grows automatically.
  setInterval(function () { 
    requestChildHeight(); 
  }, 500);

  // Send theme occasionally (in case user switches system mode while on page)
  setInterval(function () {
    sendTheme();
  }, 2000);

})();
</script>
