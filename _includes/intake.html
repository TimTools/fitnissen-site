<style>
  /* 1. Full-Bleed Breakout Strategy */
  .intake-full-bleed {
    width: 100vw;
    position: relative;
    left: 50%;
    right: 50%;
    margin-left: -50vw;
    margin-right: -50vw;
    padding: 0;
    box-sizing: border-box;
    overflow: hidden;
    background: transparent;
  }

  /* 2. Seamless Iframe */
  .intake-iframe {
    width: 100%;
    border: 0;
    display: block;
    background: transparent;
    min-height: 800px;
    transition: height 0.2s ease-out;
  }
  
  /* 3. Footer Styling (Standaard / Light Mode) */
  .intake-footer {
    text-align: center; 
    padding: 2rem 1rem;
    color: #555555;       /* Donkergrijs (voor witte achtergrond) */
    font-size: 0.9rem;
    background-color: transparent !important;
    transition: color 0.3s ease;
  }

  .intake-footer a {
    color: inherit;
    text-decoration: underline;
  }

  /* 4. Footer Styling (Dark Mode - BULLETPROOF) */
  
  /* A. Luister direct naar OS/Browser instelling (CSS only fallback) */
  @media (prefers-color-scheme: dark) {
    .intake-footer { color: #a0a0a0 !important; }
    .intake-footer a { color: #58a6ff !important; }
    .intake-footer a:hover { color: #ffffff !important; }
  }

  /* B. Luister naar de HTML class (Jekyll Theme toggle) */
  html.dark .intake-footer {
    color: #a0a0a0 !important;
  }
  html.dark .intake-footer a {
    color: #58a6ff !important;
  }
  html.dark .intake-footer a:hover {
    color: #ffffff !important;
  }

  /* C. Luister naar onze eigen geforceerde JS class (.is-dark) */
  .intake-full-bleed.is-dark .intake-footer {
    color: #a0a0a0 !important;
  }
  .intake-full-bleed.is-dark .intake-footer a {
    color: #58a6ff !important;
  }
  .intake-full-bleed.is-dark .intake-footer a:hover {
    color: #ffffff !important;
  }
</style>

<div class="intake-full-bleed" id="intakeContainer">
  <iframe id="intakeIframe"
          class="intake-iframe"
          src="https://intake.myotherfiles.nl/?embed=1"
          title="Intake formulier - Fit Nissen"
          loading="lazy"
          scrolling="auto" 
          allow="clipboard-read; clipboard-write; microphone; camera; geolocation; encrypted-media"
          sandbox="allow-forms allow-scripts allow-same-origin allow-popups">
  </iframe>

  <div class="intake-footer">
    Werkt het bovenstaande formulier niet niet? <a href="https://intake.myotherfiles.nl/" target="_blank" rel="noopener">Open intake in nieuw venster</a>
  </div>
</div>

<script>
(function () {
  const iframe = document.getElementById('intakeIframe');
  const container = document.getElementById('intakeContainer');
  const allowedChildOrigin = 'https://intake.myotherfiles.nl';

  // Configuatie ophalen uit Liquid
  const layoutTheme = "{{ page.header.theme | default: page.article_header.theme }}";
  const accentColor = '#1f7a4a';
  const textColorDark = '#e6eef3';
  const textColorLight = '#222222';

  function getActiveTheme() {
    // 1. Forceer als contact.html 'dark' of 'light' zegt
    if (layoutTheme === 'dark' || layoutTheme === 'light') return layoutTheme;
    
    // 2. Anders: check OS of Thema knop
    let theme = document.documentElement.getAttribute('data-bs-theme') || localStorage.getItem('theme');
    // Check of de HTML tag de class 'dark' heeft (door ons head-script)
    if (!theme && document.documentElement.classList.contains('dark')) {
        theme = 'dark';
    }
    // Fallback: OS check
    if (!theme) {
      theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    }
    return theme;
  }

  function sendTheme() {
    const theme = getActiveTheme();
    
    // Debug log om te checken of het werkt (kijk in je browser console F12)
    // console.log('Intake Theme Detected:', theme);

    // Update de container class voor de footer tekst
    if (theme === 'dark') {
      container.classList.add('is-dark');
    } else {
      container.classList.remove('is-dark');
    }

    // Stuur naar iframe
    const payload = {
      type: 'setTheme',
      theme: theme,
      accent: accentColor,
      textColor: theme === 'dark' ? textColorDark : textColorLight
    };
    try { iframe.contentWindow.postMessage(JSON.stringify(payload), allowedChildOrigin); } catch (e) { }
  }

  // Hoogte aanpassen
  function requestChildHeight() {
    try { iframe.contentWindow.postMessage(JSON.stringify({ type: 'requestHeight' }), allowedChildOrigin); } catch (e) {}
  }

  window.addEventListener('message', function (e) {
    if (allowedChildOrigin !== '*' && e.origin !== allowedChildOrigin) return;
    let data; try { data = JSON.parse(e.data); } catch (err) { return; }
    
    if (data && data.type === 'setHeight' && data.height) {
      const h = parseInt(data.height, 10);
      if (!isNaN(h) && h > 100) iframe.style.height = (h + 20) + 'px';
    }
  }, false);

  iframe.addEventListener('load', function () {
    setTimeout(requestChildHeight, 100);
    setTimeout(sendTheme, 100);
  });

  // Polling loops
  setInterval(requestChildHeight, 500);
  setInterval(sendTheme, 2000);

})();
</script>
